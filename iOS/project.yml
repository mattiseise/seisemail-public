# XcodeGen: `make ios` luo tästä iOS/Mak8rMail.xcodeproj -projektin.
name: Mak8rMail
options:
  bundleIdPrefix: fi.mak8r
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  Mak8rMail:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  Mak8rMail-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Jaetaan Mac-sovelluksen kanssa; alustakohtaiset osat ovat #if os(macOS) -lohkoissa.
      - path: ../Sources/Mak8rMail/AppModel.swift
        group: Shared
      - path: ../Sources/Mak8rMail/Theme.swift
        group: Shared
      - path: ../Sources/Mak8rMail/Notifier.swift
        group: Shared
      - path: ../Sources/Mak8rMail/ThreadWebView.swift
        group: Shared
      - path: ../Sources/Mak8rMail/RelativeDate.swift
        group: Shared
    dependencies:
      - package: Mak8rMail
        product: MailCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Mak8r Mail
        CFBundleDevelopmentRegion: fi
        GoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - fi.mak8r.mail.refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Mak8r Mail
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
